{% extends "base.html" %}
{% block content %}
  <p><strong>First name: </strong>{{ driver.first_name }}</p>
  <p><strong>Last name: </strong>{{ driver.last_name }}</p>
  <hr>
  <div class="ml-3">
    <h3>Driver's cars:</h3>
    <ul>
      {% for car in driver.cars.all %}
        <li>{{ car.model }}</li>
        <hr>
      {% empty %}
        <p>This driver does not have cars</p>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
