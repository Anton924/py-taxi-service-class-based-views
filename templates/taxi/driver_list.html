{% extends "base.html" %}
{% block content %}
  <h1>Drivers</h1>
  {% if driver_list %}
    <ul>
      {% for driver in driver_list %}
        <li><a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a></li>
      {% empty %}
        <p>There are no drivers</p>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
